version: '3.9'

services:

  # ── Java Spring Boot Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peerlink-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    expose:
      - "8080"
    networks:
      - peerlink-net
    healthcheck:
      test: ["CMD", "curl", "-f", "https://peerlink-p2p-file-sharing-app.onrender.com"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Next.js Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
      
    container_name: peerlink-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
    
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - peerlink-net

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: peerlink-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - peerlink-net

networks:
  peerlink-net:
    driver: bridge
